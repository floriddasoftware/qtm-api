# fly.toml app configuration file generated for qtm-api on 2026-11-20T23:24:54Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'qtm-api'
primary_region = 'ams'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
