[package]
name = "qtm-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
qp-hd = { git = "https://github.com/floriddasoftware/QTM" }
qtm-graph = { git = "https://github.com/floriddasoftware/Quantum-Economies" }
hex = "0.4"
mio = { version = "1", features = ["net", "os-poll"] }
bit_minner = {
    package = "bit-minner",
    git = "https://github.com/floriddasoftware/bit-miner",
    optional = true
}

[features]
default = ["bit-minner"]
bit-minner = ["dep:bit_minner"]
