
[package]
name = "qtm-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
qp-hd = { git = "https://github.com/floriddasoftware/QTM" }
qtm-graph = { git = "https://github.com/floriddasoftware/Quantum-Economies" }
hex = "0.4"
mio = { version = "1", features = ["net", "os-poll"] }
bitcoin = "0.32.7"
bit_miner = {
    package = "bit-miner",
    git = "https://github.com/floriddasoftware/bit-miner",
    optional = true
}

quantom_value = { git = "https://github.com/QuantPerm-Labs/Quantom-VALUE" }

rustls = {
    version = "0.23",
    default-features = false,
    features = ["ring", "std", "tls12"],
    optional = true
}

[features]
default = ["bit-miner"]
bit-miner = ["dep:bit_miner", "dep:rustls"]


