[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

qp-hd = { git = "https://github.com/floriddasoftware/QTM" }
qtm-graph = { git = "https://github.com/floriddasoftware/Quantum-Economies" }
quantom_value = { git = "https://github.com/QuantPerm-Labs/Quantom-VALUE" }

hex = "0.4"
mio = { version = "1", features = ["net", "os-poll"] }
bitcoin = "0.32.7"

bit_miner = {
    package = "bit-miner",
    git = "https://github.com/floriddasoftware/bit-miner",
    optional = true
}

rustls = {
    version = "0.23",
    default-features = false,
    features = ["ring", "std", "tls12"],
    optional = true
}

tokio-rustls = { version = "0.26", optional = true }